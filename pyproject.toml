[project]
name = "reticulum-stack"
version = "0.1.1"
description = "Pinned Reticulum/NomadNet stack for NixOS deployment via uv2nix"
requires-python = ">=3.10"
dependencies = [
    "rns==1.5.5",
    "nomadnet==1.4.4",
    "lxmf==1.2.0",
]

# No [build-system] section deliberately - this is a virtual/non-buildable
# root project, just a container for pinning and locking third-party
# dependencies. Nothing here needs to be built or installed itself.
